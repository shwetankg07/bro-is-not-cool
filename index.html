<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 40%, #3f74ff, #1d4fe0);
    color: #fff;
    font-family: Anton, Impact, "Arial Black", sans-serif;
    text-transform: uppercase;
  }
  main {
    height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vh; text-align: center; padding: 0 4vw; box-sizing: border-box;
  }
  .top, h1 {
    margin: 0; line-height: 1; position: relative; z-index: 1;
    -webkit-text-stroke: 0.08em #000; paint-order: stroke fill;
  }
  .top { font-size: clamp(2rem, 7vw, 13vh); animation: fade .4s both; }
  h1 { font-size: min(30vw, 32vh); animation: slam .25s 2.1s both cubic-bezier(.2, 1.6, .4, 1); }
  svg {
    width: min(80vw, 520px); shape-rendering: crispEdges;
    animation: nope 2s both;
  }

  @keyframes fade { from { opacity: 0; } }
  @keyframes slam { from { opacity: 0; transform: scale(3) rotate(-8deg); } }
  /* the cool glasses drop in, refuse you, and slide off */
  @keyframes nope {
    0%   { transform: translateY(-110vh); animation-timing-function: ease-in; }
    30%  { transform: translateY(0); }
    37%  { transform: translateY(-10px); }
    44%  { transform: translateY(0) rotate(0); }
    52%  { transform: rotate(-8deg); }
    60%  { transform: rotate(8deg); }
    68%  { transform: rotate(-8deg); }
    76%  { transform: rotate(0); animation-timing-function: ease-in; }
    100% { transform: translate(8%, 60%) rotate(12deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 1ms !important; animation-delay: 0s !important; }
  }
